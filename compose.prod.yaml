services:
  app:
    image: ghcr.io/aled-studio/kairos-frontend:latest
    restart: unless-stopped
    networks:
      - web
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.kairos-frontend.rule=Host(`${DOMAIN}`)'
      - 'traefik.http.routers.kairos-frontend.entrypoints=websecure'
      - 'traefik.http.routers.kairos-frontend.tls.certresolver=letsencrypt'
      - 'traefik.http.services.kairos-frontend.loadbalancer.server.port=80'

networks:
  web:
    external: true
